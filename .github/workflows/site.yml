# The website, deck's front door, published to GitHub Pages.
#
# The pages live in site/; there is nothing to build.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  # A new or edited release changes the changelog too, but a run started by
  # a release runs from its tag, and Pages takes deploys from main only. So
  # changelog.yml asks for this from main instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The changelog, from the releases
        # GitHub's own rendering of each release, which it sanitises, so the
        # notes and their images read exactly as they do there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.html+json" \
            "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | {tag: .tag_name, name, prerelease, published: .published_at, url: .html_url, html: .body_html}]' \
            > site/changelog/releases.json
          [ "$(jq length site/changelog/releases.json)" -gt 0 ] || { echo "no releases came back"; exit 1; }
      - name: Check that every local link is there
        run: |
          for page in site/index.html site/play/index.html site/docs/index.html site/changelog/index.html; do
            dir=$(dirname "$page")
            grep -oE '(src|href)="[^"#:]+"' "$page" | sed -E 's/^(src|href)="//; s/"$//' | while read -r ref; do
              case "$ref" in /*) target="site$ref" ;; *) target="$dir/$ref" ;; esac
              case "$ref" in */) target="$target/index.html" ;; esac
              [ -e "$target" ] || { echo "$page links to $ref, which is not there"; exit 1; }
            done
          done
          # and every #anchor on the home page has its target
          grep -oE 'href="#[^"]+"' site/index.html | sed -E 's/^href="#//; s/"$//' | sort -u | while read -r id; do
            grep -q "id=\"$id\"" site/index.html || { echo "site/index.html links to #$id, which is not there"; exit 1; }
          done
      - name: Check the shared shell and the demo deck are fresh
        # tools/shell.py writes the nav and footer into every page, tools/play.py writes /play/;
        # a page edited by hand instead would drift.
        run: |
          python3 site/tools/shell.py --check
          python3 site/tools/play.py --check
      - name: Count visits
        # Every page gets the website's visit counter. What it counts is on
        # /telemetry/; the app's own usage counts stay opt-in and separate.
        run: python3 site/tools/analytics.py site
      - name: Leave out what is not part of the site
        run: rm -rf site/README.md site/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only deploys share a group, so a pull request can never cancel one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

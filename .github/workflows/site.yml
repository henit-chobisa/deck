# The website, deck's front door, published to GitHub Pages.
#
# The pages live in site/. The frames the scroll plays — 360 stills cut from
# recordings of the window — do not: they are 25 MB, and committed here they
# would be in every clone forever. They sit on the pr-assets branch under
# site-frames/, and are copied in at build time.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  # A new or edited release changes the changelog.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring in the frames
        run: |
          git fetch --depth=1 origin pr-assets
          git archive FETCH_HEAD site-frames | tar -x
          mkdir -p site/frames
          cp -r site-frames/l site-frames/s site/frames/
      - name: The changelog, from the releases
        # GitHub's own rendering of each release, which it sanitises, so the
        # notes and their images read exactly as they do there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.html+json" \
            "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | {tag: .tag_name, name, prerelease, published: .published_at, url: .html_url, html: .body_html}]' \
            > site/changelog/releases.json
          [ "$(jq length site/changelog/releases.json)" -gt 0 ] || { echo "no releases came back"; exit 1; }
      - name: Check that every frame and every local link is there
        run: |
          for set in l s; do
            n=$(ls site/frames/$set/*.webp | wc -l)
            [ "$n" -eq 360 ] || { echo "site/frames/$set has $n frames, not 360"; exit 1; }
          done
          for page in site/index.html site/docs/index.html site/changelog/index.html; do
            dir=$(dirname "$page")
            grep -oE '(src|href)="[^"#:]+"' "$page" | sed -E 's/^(src|href)="//; s/"$//' | while read -r ref; do
              target="$dir/$ref"
              case "$ref" in */) target="$target/index.html" ;; esac
              [ -e "$target" ] || { echo "$page links to $ref, which is not there"; exit 1; }
            done
          done
      - name: Leave out what is not part of the site
        run: rm -f site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only deploys share a group, so a pull request can never cancel one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

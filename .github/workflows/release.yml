# Build the thing people actually install.
#
# Until this existed a release carried a demo video and nothing to run, and
# every install path compiled nineteen tree-sitter grammars on the reader's
# machine. That is minutes of waiting for something that could be a download.
#
# The binary is signed ad-hoc — `codesign -s -`, no identity, no Apple
# Developer account. On Apple Silicon a binary has to carry *some* signature to
# execute at all, and ad-hoc satisfies that. What it does not satisfy is
# Gatekeeper's quarantine, which is set by browsers and by Mail and *not* by
# curl or by Homebrew. So the install instructions have to stay `curl` and
# `brew`: a tarball somebody downloads in Safari will be held, and no amount of
# signing here changes that without a Developer ID.
name: Release

# On the release, not on the tag.
#
# `cut-a-release` pushes the tag in step 3 and writes the release in step 5, so
# a workflow triggered by the tag runs while there is still nothing to upload
# to and `gh release upload` fails. Publishing the release is the event that
# means *there is somewhere to put this*.
#
# The pull request trigger is only for changes to this file. Two release builds
# is twenty minutes, which is not a thing to spend on every pull request — but
# it is exactly what you want when the thing being changed is the release.
on:
  release:
    types: [published]
  pull_request:
    paths: [".github/workflows/release.yml", "install"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach the binary to
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # The revision the release points at, not whatever main happens to be.
      # A dispatch for an existing tag after main has moved would otherwise
      # build something else entirely and attach it under that tag's name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Both architectures, then one file. A universal binary means the install
      # script has nothing to decide and no way to pick wrong.
      - run: cargo build --locked --release -p deck-app --target aarch64-apple-darwin
      - run: cargo build --locked --release -p deck-app --target x86_64-apple-darwin

      - name: Make it universal
        run: |
          mkdir -p out
          lipo -create -output out/deck \
            target/aarch64-apple-darwin/release/deck \
            target/x86_64-apple-darwin/release/deck
          lipo -info out/deck

      # Ad-hoc, and verified rather than assumed: an unsigned binary runs
      # nowhere on arm64, and a silently unsigned release would be discovered
      # by the first person to install it.
      - name: Sign it
        run: |
          codesign --force --sign - out/deck
          codesign --verify --verbose out/deck
          codesign -dv out/deck 2>&1 | grep -q adhoc

      - name: Check it runs
        run: ./out/deck --version

      - name: Wrap it
        id: wrap
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # A pull request has no tag, and `github.ref_name` there is `52/merge`
          # — a slash, which is not a filename. The name only matters for the
          # upload, which a pull request does not do.
          tag="$TAG"
          [ -n "$tag" ] || tag=dev
          name="deck-${tag}-macos-universal.tar.gz"
          tar -czf "$name" -C out deck
          shasum -a 256 "$name" > "$name.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Only a real release has somewhere to put it. A pull request has proved
      # the thing builds and runs, which is what it was asked.
      - name: Attach it to the release
        if: github.event_name == 'release' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.wrap.outputs.tag }}" \
            "${{ steps.wrap.outputs.name }}" \
            "${{ steps.wrap.outputs.name }}.sha256" \
            --clobber

  # Linux and Windows, each on its own chip, so the install script has a
  # build to fetch everywhere and nothing is ever run under emulation.
  #
  # The names are the contract: `deck-<tag>-<platform>.tar.gz`, where
  # <platform> is exactly what the install script and `upgrade::PLATFORM`
  # ask for. A tarball on Windows too — `tar` has shipped with Windows since
  # 2018, and one archive format means one unpacking path in `deck upgrade`.
  others:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub still runs: a binary links against the
          # glibc it was built on and runs on that or newer, so building old
          # is what lets it run on most machines.
          - { platform: linux-x86_64, runner: ubuntu-22.04, exe: deck }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm, exe: deck }
          - { platform: windows-x86_64, runner: windows-latest, exe: deck.exe }
          - { platform: windows-aarch64, runner: windows-11-arm, exe: deck.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # What the window and the page view link against on Linux.
      - name: Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev pkg-config

      # The ARM runner has no clang on PATH, and two crypto crates need it.
      - name: Clang
        if: matrix.platform == 'windows-aarch64'
        shell: pwsh
        run: |
          $llvm = "${env:ProgramFiles}\LLVM\bin"
          if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
          "$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: cargo build --locked --release -p deck-app

      - name: Check it runs
        shell: bash
        run: ./target/release/${{ matrix.exe }} --version

      - name: Wrap it
        id: wrap
        shell: bash
        # The tag arrives as data, not as script: handed in through the
        # environment, a tag with a quote in it stays a tag.
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$TAG"
          [ -n "$tag" ] || tag=dev
          name="deck-${tag}-${{ matrix.platform }}.tar.gz"
          tar -czf "$name" -C target/release "${{ matrix.exe }}"
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Kept on a pull request too, so a change to this file can be tried
      # with the install script before any release depends on it.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.wrap.outputs.name }}
          path: |
            ${{ steps.wrap.outputs.name }}
            ${{ steps.wrap.outputs.name }}.sha256

      - name: Attach it to the release
        if: github.event_name == 'release' || inputs.tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.wrap.outputs.tag }}" \
            "${{ steps.wrap.outputs.name }}" \
            "${{ steps.wrap.outputs.name }}.sha256" \
            --clobber

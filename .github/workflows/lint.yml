# Formatting and lints.
#
# One platform is enough: neither of these reads the machine it runs on, and a
# second copy would only mean waiting twice for the same answer.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that is ignored is not a warning. Fatal here and nowhere else, so
  # a local build stays quick to iterate on.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    # macOS, because `deck-app` is the crate with most of the code in it and it
    # only builds where the window does. Linting the other three on Linux would
    # be linting the quarter that was least likely to be wrong.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

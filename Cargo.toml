[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/theme", "crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/henitchobisa/deck"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# The protocol is full of small integers. An accidental `as` between them is
# exactly the bug class this crate exists to prevent.
cast_possible_truncation = "warn"

[package]
name = "deck-render"
description = "How deck draws a deck, as data: highlighted code, shared by the window and every export. Opens no window, though it links gpui."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deck-core = { path = "../core" }
serde_json = { workspace = true }
# Shaping, kerning included, and advance widths, from the embedded faces, for
# breaking lines the way the window does without a window. Already in the tree.
rustybuzz = "0.20"
gpui-kit = { version = "0.6", features = [
    # Syntax highlighting is not on by default, and a grammar is only compiled
    # in if it is named. Every language deck can highlight is listed here, and
    # each one costs binary size — which is why this is a chosen set and not
    # `tree-sitter-languages`.
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-ruby",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-toml",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-java",
] }

[[test]]
# Its own main, so it runs on the main thread, where the Mac platform has to
# be made. See the file.
name = "agree"
harness = false

[lints]
workspace = true

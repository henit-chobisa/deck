[package]
name = "deck-render"
description = "How deck draws a deck, as data: highlighted code, shared by the window and every export. No window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deck-core = { path = "../core" }
serde_json = { workspace = true }
gpui-kit = { version = "0.6", features = [
    # Syntax highlighting is not on by default, and a grammar is only compiled
    # in if it is named. Every language deck can highlight is listed here, and
    # each one costs binary size — which is why this is a chosen set and not
    # `tree-sitter-languages`.
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-ruby",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-toml",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-java",
] }

[lints]
workspace = true

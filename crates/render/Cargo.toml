[package]
name = "deck-render"
description = "How deck draws a deck, as data: highlighted code, shared by the window and every export. Opens no window, though it links gpui."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deck-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Shaping, kerning included, and advance widths, from the embedded faces, for
# breaking lines the way the window does without a window. Already in the tree.
rustybuzz = "0.20"
# Cuts each embedded face down to the characters an export sets, so a file
# carries a few hundred glyphs rather than a megabyte of faces. Pinned: it is
# written for PDF and what it hands back is completed into a web font in
# `export::face`, which depends on exactly which tables it keeps. At 0.2.3,
# the version krilla 0.7 also builds, so the two share one font stack
# (skrifa 0.37) rather than bringing two.
subsetter = { version = "=0.2.3", default-features = false }
# The PDF writer, and its SVG half for diagrams: pure Rust, with real text —
# it shapes, subsets and embeds the faces it is given, so a PDF's words and
# code can be selected and searched. Both are MIT or Apache-2.0; what they
# build on adds tiny-skia (BSD-3-Clause) and zune-jpeg (MIT, Apache-2.0 or
# Zlib). 0.7 rather than 0.8: it builds on the usvg, resvg and tiny-skia the
# window's tree already holds, where 0.8 brought a second copy of each, and
# nothing used here changed between them. Pinned, as a PDF's bytes are part
# of what a golden test checks.
krilla = "=0.7.0"
krilla-svg = "=0.7.0"
# The SVG tree krilla-svg draws, at the version it is built against, so a
# diagram is read with Plex in its font database.
usvg = "=0.45.1"
gpui-kit = { version = "0.6", features = [
    # Syntax highlighting is not on by default, and a grammar is only compiled
    # in if it is named. Every language deck can highlight is listed here, and
    # each one costs binary size — which is why this is a chosen set and not
    # `tree-sitter-languages`.
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-ruby",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-toml",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-java",
] }

[[test]]
# Its own main, so it runs on the main thread, where the Mac platform has to
# be made. See the file.
name = "agree"
harness = false

[lints]
workspace = true
